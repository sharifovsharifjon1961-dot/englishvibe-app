<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f10" media="(prefers-color-scheme: dark)">
  <title>CEFR Mock Exam</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & THEME MAPPING
       ========================================================================== */
    :root {
      --tg-bg: var(--tg-theme-bg-color, #ffffff);
      --tg-text: var(--tg-theme-text-color, #111111);
      --tg-hint: var(--tg-theme-hint-color, #6b7280);
      --tg-link: var(--tg-theme-link-color, #3390ec);
      --tg-btn: var(--tg-theme-button-color, #3390ec);
      --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #f7f9fc);

      --color-bg: var(--tg-bg);
      --color-surface: var(--tg-secondary-bg);
      --color-text: var(--tg-text);
      --color-text-secondary: var(--tg-hint);
      --color-accent: var(--tg-btn);
      --color-accent-hover: color-mix(in srgb, var(--tg-btn) 88%, #000);
      --color-accent-text: var(--tg-btn-text);
      --color-border: rgba(17, 17, 17, 0.08);
      
      --color-success: #10b981;
      --color-danger: #ef4444;
      --color-warning: #f59e0b;

      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0f0f10;
        --color-surface: #1a1a1c;
        --color-text: #f5f5f7;
        --color-text-secondary: #9ca3af;
        --color-border: rgba(255, 255, 255, 0.08);
      }
    }

    /* ==========================================================================
       2. RESET & BASE
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-ui);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    .hidden { display: none !important; }

    /* ==========================================================================
       3. LAYOUT & HEADER
       ========================================================================== */
    #app-header {
      position: sticky; top: 0; z-index: 100;
      background-color: color-mix(in srgb, var(--color-bg) 85%, transparent);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--color-border);
      padding: 14px 16px;
      padding-top: max(14px, var(--safe-top));
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    #header-title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { padding: 20px 16px; padding-bottom: calc(24px + var(--safe-bottom)); max-width: 720px; margin: 0 auto; }
    .view { display: none; animation: viewEnter 220ms cubic-bezier(0.22, 1, 0.36, 1); }
    .view.active { display: block; }
    @keyframes viewEnter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* ==========================================================================
       4. COMPONENTS: BUTTONS, CARDS, FILTERS
       ========================================================================== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; padding: 10px 18px; border-radius: var(--radius-md);
      font-size: 15px; font-weight: 500; border: 1px solid transparent;
      transition: all 150ms ease; white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background-color: var(--color-accent); color: var(--color-accent-text); }
    .btn-secondary { background-color: transparent; color: var(--color-accent); border-color: var(--color-accent); font-size: 14px; min-height: 36px; padding: 6px 12px; }
    .btn-icon { min-width: 44px; min-height: 44px; padding: 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-secondary); }
    .btn-icon.flagged { color: var(--color-warning); border-color: var(--color-warning); background-color: rgba(245, 158, 11, 0.12); }

    .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 8px; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0; min-height: 36px; padding: 0 16px; border-radius: 999px;
      background-color: var(--color-surface); color: var(--color-text-secondary);
      border: 1px solid var(--color-border); font-size: 14px; font-weight: 500;
      transition: all 150ms ease;
    }
    .filter-btn.active { background-color: var(--color-text); color: var(--color-bg); border-color: var(--color-text); }

    .mock-card, .module-card {
      background-color: var(--color-bg); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 16px; cursor: pointer;
      transition: all 150ms ease;
    }
    .mock-card:active, .module-card:active { background-color: var(--color-surface); transform: scale(0.98); }
    .mock-card h3, .module-card h4 { font-size: 16px; margin-bottom: 6px; }
    .mock-card .meta, .module-card .status { font-size: 13px; color: var(--color-text-secondary); }
    .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .info-block { background-color: var(--color-surface); border-radius: var(--radius-md); padding: 14px 16px; font-size: 14px; color: var(--color-text-secondary); margin-bottom: 16px; border: 1px solid var(--color-border); }

    /* ==========================================================================
       5. EXAM INTERFACE
       ========================================================================== */
    .exam-top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--color-border); }
    .timer { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .timer.warning { color: var(--color-danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .question-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; padding: 12px; background-color: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border); }
    .q-nav-btn {
      width: 38px; height: 38px; border-radius: var(--radius-sm); border: 1px solid transparent;
      background-color: var(--color-bg); color: var(--color-text); font-size: 14px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; position: relative; transition: all 150ms ease;
    }
    .q-nav-btn:active { transform: scale(0.95); }
    .q-nav-btn.active { border-color: var(--color-accent); font-weight: 700; }
    .q-nav-btn.answered { background-color: var(--color-accent); color: var(--color-accent-text); }
    .q-nav-btn.flagged::after { content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; background-color: var(--color-warning); border-radius: 50%; }
    .q-nav-btn.no-key { background-color: var(--color-text-secondary); color: var(--color-bg); opacity: 0.6; }

    .passage {
      font-family: var(--font-serif); font-size: 16px; line-height: 1.7; white-space: pre-wrap;
      background-color: var(--color-surface); padding: 20px; border-radius: var(--radius-md);
      margin-bottom: 24px; border-left: 3px solid var(--color-accent);
    }
    .question-block { margin-bottom: 28px; }
    .question-text { font-size: 16px; font-weight: 600; margin-bottom: 14px; line-height: 1.4; }
    .options-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .option-label {
      display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      background-color: var(--color-bg); cursor: pointer; transition: all 150ms ease;
    }
    .option-label:active { background-color: var(--color-surface); }
    .option-label.selected { border-color: var(--color-accent); background-color: color-mix(in srgb, var(--color-accent) 8%, transparent); }
    .option-label input[type="radio"] { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--color-accent); flex-shrink: 0; }

    /* ==========================================================================
       6. SPECIALIZED MODULES (Listening, Speaking, Writing, Results)
       ========================================================================== */
    .audio-container { background-color: var(--color-surface); border-radius: var(--radius-md); padding: 16px; margin-bottom: 20px; border: 1px solid var(--color-border); text-align: center; }
    .audio-container audio { width: 100%; height: 40px; border-radius: var(--radius-sm); }
    .audio-empty { color: var(--color-text-secondary); font-style: italic; font-size: 14px; padding: 12px 0; }

    .recorder-ui { text-align: center; padding: 24px 16px; background-color: var(--color-surface); border-radius: var(--radius-md); border: 1px solid var(--color-border); margin-bottom: 20px; }
    .record-timer { font-size: 28px; font-weight: 600; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
    .record-btn {
      width: 72px; height: 72px; border-radius: 50%; background-color: var(--color-danger);
      border: none; color: white; cursor: pointer; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center; transition: transform 150ms ease;
    }
    .record-btn:active { transform: scale(0.95); }
    .record-btn.recording { animation: pulse-record 1.5s infinite; }
    @keyframes pulse-record { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .record-status { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 16px; }

    .writing-area {
      width: 100%; min-height: 220px; padding: 16px; border: 1px solid var(--color-border);
      border-radius: var(--radius-md); background-color: var(--color-bg); color: var(--color-text);
      font-family: var(--font-ui); font-size: 16px; line-height: 1.6; resize: vertical; outline: none;
      transition: border-color 150ms ease;
    }
    .writing-area:focus { border-color: var(--color-accent); }
    .word-count { text-align: right; font-size: 13px; color: var(--color-text-secondary); margin-top: 8px; font-variant-numeric: tabular-nums; }
    .word-count.below-min { color: var(--color-danger); font-weight: 600; }

    .results-summary { text-align: center; padding: 32px 16px; border-bottom: 1px solid var(--color-border); margin-bottom: 24px; }
    .results-summary h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-secondary); margin-bottom: 12px; }
    .score-display { font-size: 42px; font-weight: 700; color: var(--color-accent); line-height: 1; margin-bottom: 8px; }
    .review-item { padding: 16px; border-radius: var(--radius-md); background-color: var(--color-surface); margin-bottom: 12px; border: 1px solid var(--color-border); border-left-width: 4px; }
    .review-item.correct { border-left-color: var(--color-success); }
    .review-item.incorrect { border-left-color: var(--color-danger); }
    .review-item.no-key { border-left-color: var(--color-text-secondary); }
    .review-q-num { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 6px; }
    .review-question { font-size: 15px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
    .review-answer { font-size: 14px; margin-bottom: 4px; display: flex; align-items: baseline; gap: 8px; }
    .review-answer.user { color: var(--color-text-secondary); }
    .review-answer.correct-ans { color: var(--color-success); font-weight: 500; }
  </style>
</head>
<body>
  <header id="app-header">
    <h1 id="header-title">CEFR Mock Exams</h1>
    <button id="pdf-btn" class="btn btn-secondary hidden" type="button" aria-label="Asl PDF faylni ochish">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      Asl PDF'ni ochish
    </button>
  </header>

  <main id="main-content">
    <!-- VIEW 1: Mock List -->
    <section id="mock-list-view" class="view active" aria-label="Imtihonlar ro'yxati">
      <div class="filter-bar" role="tablist" aria-label="Daraja bo'yicha filtrlash">
        <button class="filter-btn active" data-level="ALL">Barchasi</button>
        <button class="filter-btn" data-level="B1">B1</button>
        <button class="filter-btn" data-level="B2">B2</button>
        <button class="filter-btn" data-level="C1">C1</button>
      </div>
      <div id="mocks-container" class="mocks-grid"></div>
    </section>

    <!-- VIEW 2: Module Selection -->
    <section id="module-view" class="view" aria-label="Modul tanlash">
      <div id="module-header-info" class="info-block"></div>
      <div id="modules-grid" class="modules-grid"></div>
    </section>

    <!-- VIEW 3: Exam Interface -->
    <section id="exam-view" class="view" aria-label="Imtihon jarayoni">
      <div class="exam-top-bar">
        <div id="timer-display" class="timer" aria-live="polite">--:--</div>
        <button id="flag-toggle-btn" class="btn btn-icon" title="Ko'rib chiqish uchun belgilash" aria-label="Savolni belgilash">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
        </button>
      </div>
      <div id="question-navigator" class="question-nav" role="tablist" aria-label="Savollar navigatsiyasi"></div>
      <div id="exam-content" class="exam-content"></div>
    </section>

    <!-- VIEW 4: Results -->
    <section id="results-view" class="view" aria-label="Natijalar">
      <div class="results-summary">
        <h2>Umumiy Natija</h2>
        <div class="score-display" id="score-value">0 / 0</div>
        <div style="color: var(--color-text-secondary)" id="score-percentage">0% to'g'ri javob</div>
      </div>
      <div style="font-size: 15px; font-weight: 600; margin-bottom: 12px; padding-left: 4px;">Batafsil Tahlil</div>
      <div id="results-review"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
