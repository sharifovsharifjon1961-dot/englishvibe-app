<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CEFR Mock Exam</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --tg-bg: var(--tg-theme-bg-color, #ffffff);
      --tg-text: var(--tg-theme-text-color, #222222);
      --tg-hint: var(--tg-theme-hint-color, #888888);
      --tg-link: var(--tg-theme-link-color, #3390ec);
      --tg-btn: var(--tg-theme-button-color, #3390ec);
      --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
      --tg-secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
      
      --accent: var(--tg-btn);
      --border: 1px solid rgba(0, 0, 0, 0.1);
      --radius: 4px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-serif: Georgia, "Times New Roman", serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font-sans);
      background-color: var(--tg-bg);
      color: var(--tg-text);
      line-height: 1.5;
      font-size: 16px;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .hidden { display: none !important; }

    /* Header */
    #app-header {
      padding: 16px;
      border-bottom: var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--tg-secondary-bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    #header-title { font-size: 18px; font-weight: 600; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border: var(--border);
      border-radius: var(--radius);
      background: var(--tg-bg);
      color: var(--tg-text);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms, border-color 150ms;
      min-height: 44px;
    }
    .btn:active { background: var(--tg-secondary-bg); }
    .btn-primary {
      background: var(--tg-btn);
      color: var(--tg-btn-text);
      border-color: var(--tg-btn);
    }
    .btn-primary:active { opacity: 0.9; }
    .btn-secondary { font-size: 14px; padding: 8px 12px; }
    .btn-icon { padding: 8px; min-height: 44px; min-width: 44px; }
    .btn-icon.flagged { color: #e67e22; fill: #e67e22; }

    /* Views */
    .view { display: none; padding: 16px; }
    .view.active { display: block; }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-btn {
      padding: 8px 16px;
      border: var(--border);
      border-radius: 20px;
      background: var(--tg-bg);
      color: var(--tg-hint);
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--tg-text);
      color: var(--tg-bg);
      border-color: var(--tg-text);
    }

    /* Mocks Grid */
    .mocks-grid { display: flex; flex-direction: column; gap: 12px; }
    .mock-card {
      padding: 16px;
      border: var(--border);
      border-radius: var(--radius);
      background: var(--tg-bg);
      cursor: pointer;
      transition: border-color 150ms;
    }
    .mock-card:active { border-color: var(--accent); }
    .mock-card h3 { font-size: 16px; margin-bottom: 4px; }
    .mock-card .meta { font-size: 13px; color: var(--tg-hint); }

    /* Modules Grid */
    .modules-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
    .module-card {
      padding: 20px 16px;
      border: var(--border);
      border-radius: var(--radius);
      text-align: left;
      cursor: pointer;
      background: var(--tg-bg);
    }
    .module-card:active { background: var(--tg-secondary-bg); }
    .module-card h4 { font-size: 15px; margin-bottom: 4px; }
    .module-card .status { font-size: 12px; color: var(--tg-hint); }

    /* Exam Top Bar */
    .exam-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: var(--border);
    }
    .timer {
      font-family: monospace;
      font-size: 18px;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--tg-text);
    }
    .timer.warning { color: #e74c3c; }

    /* Question Navigator */
    .question-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--tg-secondary-bg);
      border-radius: var(--radius);
    }
    .q-nav-btn {
      width: 36px;
      height: 36px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--tg-bg);
      color: var(--tg-text);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .q-nav-btn.active { border-color: var(--accent); font-weight: 600; }
    .q-nav-btn.answered { background: var(--tg-btn); color: var(--tg-btn-text); }
    .q-nav-btn.flagged::after {
      content: '';
      position: absolute;
      top: 2px;
      right: 2px;
      width: 6px;
      height: 6px;
      background: #e67e22;
      border-radius: 50%;
    }
    .q-nav-btn.no-key { background: var(--tg-hint); color: var(--tg-bg); opacity: 0.7; }

    /* Exam Content */
    .exam-content { line-height: 1.6; }
    .passage {
      font-family: var(--font-serif);
      font-size: 16px;
      white-space: pre-wrap;
      background: var(--tg-secondary-bg);
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      border-left: 3px solid var(--accent);
    }
    .question-block { margin-bottom: 24px; }
    .question-text { font-weight: 600; margin-bottom: 12px; font-size: 16px; }
    .options-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border: var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 150ms;
    }
    .option-label:active { background: var(--tg-secondary-bg); }
    .option-label input { margin-top: 3px; accent-color: var(--accent); width: 18px; height: 18px; }
    .option-label.selected { border-color: var(--accent); background: rgba(51, 144, 236, 0.05); }

    /* Listening specific */
    .audio-player {
      width: 100%;
      margin-bottom: 16px;
      padding: 12px;
      background: var(--tg-secondary-bg);
      border-radius: var(--radius);
      text-align: center;
    }
    .audio-empty { color: var(--tg-hint); font-style: italic; padding: 20px; text-align: center; }

    /* Speaking specific */
    .recorder-ui { text-align: center; padding: 20px; }
    .record-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #e74c3c;
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin: 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .record-btn.recording { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); } 70% { box-shadow: 0 0 0 16px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }

    /* Writing specific */
    .writing-area {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: var(--border);
      border-radius: var(--radius);
      background: var(--tg-bg);
      color: var(--tg-text);
      font-family: var(--font-sans);
      font-size: 16px;
      resize: vertical;
    }
    .word-count { text-align: right; font-size: 13px; color: var(--tg-hint); margin-top: 4px; }
    .word-count.below-min { color: #e74c3c; }

    /* Results */
    .results-summary { text-align: center; padding: 24px; border-bottom: var(--border); margin-bottom: 16px; }
    .score-display { font-size: 32px; font-weight: 700; color: var(--accent); margin: 8px 0; }
    .review-item { padding: 12px; border-bottom: var(--border); }
    .review-item.correct { border-left: 3px solid #27ae60; }
    .review-item.incorrect { border-left: 3px solid #e74c3c; }
    .review-item.no-key { border-left: 3px solid var(--tg-hint); }

    /* Utilities */
    .info-block { padding: 12px; background: var(--tg-secondary-bg); border-radius: var(--radius); font-size: 14px; color: var(--tg-hint); }
  </style>
</head>
<body>
  <div id="app">
    <header id="app-header">
      <h1 id="header-title">CEFR Mock Exams</h1>
      <button id="pdf-btn" class="btn btn-secondary hidden" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Asl PDF'ni ochish
      </button>
    </header>

    <main id="main-content">
      <!-- Mock List View -->
      <section id="mock-list-view" class="view active">
        <div class="filter-bar">
          <button class="filter-btn active" data-level="ALL">Barchasi</button>
          <button class="filter-btn" data-level="B1">B1</button>
          <button class="filter-btn" data-level="B2">B2</button>
          <button class="filter-btn" data-level="C1">C1</button>
        </div>
        <div id="mocks-container" class="mocks-grid"></div>
      </section>

      <!-- Module Selection View -->
      <section id="module-view" class="view">
        <div id="module-header-info" class="info-block"></div>
        <div id="modules-grid" class="modules-grid"></div>
      </section>

      <!-- Exam Interface View -->
      <section id="exam-view" class="view">
        <div class="exam-top-bar">
          <div id="timer-display" class="timer" aria-live="polite">--:--</div>
          <button id="flag-toggle-btn" class="btn btn-icon" title="Ko'rib chiqish uchun belgilash" aria-label="Belgilash">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
          </button>
        </div>
        
        <div id="question-navigator" class="question-nav" role="tablist" aria-label="Savollar navigatsiyasi"></div>
        
        <div id="exam-content" class="exam-content">
          <!-- Dynamic content injected here -->
        </div>
      </section>

      <!-- Results View -->
      <section id="results-view" class="view">
        <div id="results-summary" class="results-summary"></div>
        <div id="results-review" class="results-review"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
